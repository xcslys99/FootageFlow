name: Bug report
description: Report reproducible incorrect behavior
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not paste API keys, private file paths, or private media.
  - type: input
    id: version
    attributes:
      label: FootageFlow version
      placeholder: 0.1.0
    validations:
      required: true
  - type: dropdown
    id: operating-system
    attributes:
      label: Operating system
      options:
        - macOS Apple Silicon
        - Windows 11 x64
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the expected and actual behavior.
    validations:
      required: true
  - type: input
    id: application-language
    attributes:
      label: Application language
      placeholder: English / 简体中文 / …
  - type: dropdown
    id: provider
    attributes:
      label: Related provider
      options:
        - Not provider-specific
        - Pexels
        - Pixabay
        - Wikimedia Commons
        - Internet Archive
        - YouTube
        - NASA
        - Library of Congress
        - National Archives
        - Europeana
        - PeerTube / SepiaSearch
        - Videvo
        - Videezy
        - Mixkit
        - Coverr
        - Vimeo
        - Link Downloader
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      placeholder: "1. Open…\n2. Search…\n3. Select…"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect FootageFlow to do?
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or recordings
      description: Remove API keys, private paths, project content, and personal information first.
  - type: textarea
    id: diagnostics
    attributes:
      label: Safe diagnostics
      description: Provider, HTTP status, and redacted log lines are useful. Never include credentials.
  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
