name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  test-and-build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Show Swift toolchain
        run: swift --version

      - name: Lint source and localizations
        run: scripts/lint.sh

      - name: Scan tracked files for secrets
        run: scripts/secret_scan.sh

      - name: Build release executable
        run: swift build -c release

      - name: Run unit tests
        run: swift test

      - name: Build and verify app bundle
        run: |
          scripts/build_app.sh
          scripts/binary_privacy_scan.sh
          codesign --verify --deep --strict dist/FootageFlow.app
          dist/FootageFlow.app/Contents/MacOS/FootageFlow --self-test
          test -x dist/FootageFlow.app/Contents/Resources/Tools/ffmpeg
          test -x dist/FootageFlow.app/Contents/Resources/Tools/ffprobe
          test -f dist/FootageFlow.app/Contents/Resources/Licenses/ffmpeg/LICENSE_FFMPEG.txt
          test -f dist/FootageFlow.app/Contents/Resources/Licenses/ffmpeg/LICENSE_X264.txt
          dist/FootageFlow.app/Contents/Resources/Tools/ffmpeg -version 2>&1 | head -n 4 | grep -q -- --enable-securetransport

      - name: Run real macOS creator workflow smoke test
        run: |
          smoke_root="$RUNNER_TEMP/FootageFlowCreatorWorkflowSmoke"
          dist/FootageFlow.app/Contents/MacOS/FootageFlow --creator-workflow-smoke "$smoke_root"
          rm -rf "$smoke_root"

  windows-core:
    # Swift 6.3 currently requires the Visual Studio 2022 C++ environment.
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install official Swift 6.3.3 toolchain
        uses: compnerd/gha-setup-swift@eeda069c5bc95ac8a9ac5cea7d4f588ae5420ca5
        with:
          swift-version: swift-6.3.3-release
          swift-build: 6.3.3-RELEASE

      - name: Show Windows Swift toolchain
        shell: pwsh
        run: swift --version

      - name: Build shared core for Windows x64
        shell: pwsh
        run: |
          New-Item -Path "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock" -Force | Out-Null
          New-ItemProperty -Path "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock" -Name "AllowDevelopmentWithoutDevLicense" -PropertyType DWord -Value 1 -Force | Out-Null
          . scripts/windows/enter-dev-shell.ps1
          swift build -c release -v

      - name: Run Windows core health check
        shell: pwsh
        run: |
          . scripts/windows/enter-dev-shell.ps1
          $binary = Join-Path (swift build -c release --show-bin-path) "FootageFlow.exe"
          $request = '{"id":"ci-health","action":"health","providerIDs":["wikimedia","internetArchive"],"language":"en"}'
          $response = $request | & $binary --core-request | ConvertFrom-Json
          if (-not $response.success -or $response.platform -ne "windows") {
            throw "Windows core health check failed"
          }

      - name: Run cross-platform unit and provider tests
        shell: pwsh
        run: |
          . scripts/windows/enter-dev-shell.ps1
          swift test

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.302

      - name: Build native Windows interface
        shell: pwsh
        run: dotnet build Windows/FootageFlow.Windows/FootageFlow.Windows.csproj -c Release

      - name: Run Windows platform self-tests
        shell: pwsh
        run: |
          . scripts/windows/enter-dev-shell.ps1
          $env:FOOTAGEFLOW_CORE_PATH = Join-Path (swift build -c release --show-bin-path) "FootageFlow.exe"
          dotnet run --project Windows/FootageFlow.Windows.Tests/FootageFlow.Windows.Tests.csproj -c Release

      - name: Build self-contained Windows package
        shell: pwsh
        run: scripts/windows/build-package.ps1 -Version "0.7.3"

      - name: Verify packaged runtimes
        shell: pwsh
        run: |
          $stage = Join-Path $PWD ".build\windows-stage"
          $required = @(
            "FootageFlow.exe",
            "Core\FootageFlowCore.exe",
            "Tools\yt-dlp.exe",
            "Tools\ffmpeg.exe",
            "Tools\ffprobe.exe",
            "Licenses\ffmpeg\LICENSE.txt",
            "Resources\en.lproj\Localizable.strings",
            "Resources\zh-Hans.lproj\Localizable.strings",
            "Resources\zh-Hant.lproj\Localizable.strings",
            "Resources\es.lproj\Localizable.strings",
            "Resources\pt-BR.lproj\Localizable.strings",
            "Resources\ja.lproj\Localizable.strings",
            "Resources\ko.lproj\Localizable.strings",
            "Resources\de.lproj\Localizable.strings",
            "Resources\fr.lproj\Localizable.strings",
            "Resources\ru.lproj\Localizable.strings"
          )
          foreach ($relative in $required) {
            if (-not (Test-Path (Join-Path $stage $relative) -PathType Leaf)) {
              throw "Packaged file is missing: $relative"
            }
          }
          $healthRequest = '{"id":"packaged-health","action":"health","providerIDs":["wikimedia","internetArchive"],"language":"en"}'
          $health = $healthRequest | & (Join-Path $stage "Core\FootageFlowCore.exe") --core-request | ConvertFrom-Json
          if (-not $health.success -or $health.platform -ne "windows") {
            throw "The packaged Windows core health check failed."
          }
          $rankRequest = '{"id":"packaged-rank","action":"rankAssets","query":"台湾美食","relevanceMode":"balanced","assets":[{"id":"food","provider":"peertube","title":"Taipei beef noodle soup","sourcePageURL":"https://example.com/food","licenseStatus":"UNKNOWN","mediaType":"video","downloadable":false,"originalMetadata":{},"searchKeyword":"Taiwan cuisine","relevanceScore":0.5},{"id":"politics","provider":"peertube","title":"Taiwan politics debate","sourcePageURL":"https://example.com/politics","licenseStatus":"UNKNOWN","mediaType":"video","downloadable":false,"originalMetadata":{},"searchKeyword":"Taiwan cuisine","relevanceScore":1.0}]}'
          $ranked = $rankRequest | & (Join-Path $stage "Core\FootageFlowCore.exe") --core-request | ConvertFrom-Json
          if (-not $ranked.success -or $ranked.assets.Count -ne 1 -or $ranked.assets[0].id -ne "food") {
            throw "The packaged shared relevance ranker failed."
          }
          $toolVersion = & (Join-Path $stage "Tools\yt-dlp.exe") --version
          if ($toolVersion -ne "2026.07.04") { throw "The bundled yt-dlp version is not the pinned release." }

      - name: Run real Windows provider smoke tests
        shell: pwsh
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          NARA_API_KEY: ${{ secrets.NARA_API_KEY }}
          EUROPEANA_API_KEY: ${{ secrets.EUROPEANA_API_KEY }}
        run: scripts/windows/live-provider-smoke.ps1

      - name: Run real Windows creator workflow smoke test
        shell: pwsh
        run: |
          $stage = (Resolve-Path ".build\windows-stage").Path
          . scripts/windows/enter-dev-shell.ps1
          $env:FOOTAGEFLOW_CORE_PATH = Join-Path $stage "Core\FootageFlowCore.exe"
          $env:FOOTAGEFLOW_CREATOR_SMOKE_TOOLS = Join-Path $stage "Tools"
          dotnet run --project Windows/FootageFlow.Windows.Tests/FootageFlow.Windows.Tests.csproj -c Release -- --creator-workflow-smoke

      - name: Compile Windows installer
        shell: pwsh
        run: |
          $compiler = (& scripts/windows/install-inno.ps1 | Select-Object -Last 1)
          $stage = (Resolve-Path ".build\windows-stage").Path
          $output = (Resolve-Path "dist\windows").Path
          & $compiler "/DAppVersion=0.7.3" "/DSourceDirectory=$stage" "/DOutputDirectory=$output" "Windows\Installer\FootageFlow.iss"
          if ($LASTEXITCODE -ne 0) { throw "The Windows installer could not be compiled." }
          $installer = Join-Path $output "FootageFlow-Setup-0.7.3-Windows-x64.exe"
          if (-not (Test-Path $installer -PathType Leaf)) { throw "The Windows installer is missing." }
          $signature = Get-AuthenticodeSignature $installer
          Write-Host "Installer signature status: $($signature.Status) (unsigned development build expected)"
          (Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant() + "  " + (Split-Path $installer -Leaf) |
            Set-Content ($installer + ".sha256") -Encoding ascii -NoNewline
          $checksumFiles = @(
            Join-Path $output "FootageFlow-0.7.3-Windows-x64-portable.zip.sha256"
            $installer + ".sha256"
          )
          foreach ($checksumFile in $checksumFiles) {
            $checksumText = Get-Content $checksumFile -Raw
            if ($checksumText -notmatch '^[0-9a-f]{64}  [^\r\n]+$') {
              throw "Checksum file is not portable SHA-256 format: $checksumFile"
            }
            $checksumParts = $checksumText -split '  ', 2
            $checkedFile = Join-Path $output $checksumParts[1]
            $actualChecksum = (Get-FileHash $checkedFile -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actualChecksum -ne $checksumParts[0]) {
              throw "Checksum verification failed: $checkedFile"
            }
          }

      - name: Clean install, launch, and uninstall test
        shell: pwsh
        run: |
          $installer = (Resolve-Path "dist\windows\FootageFlow-Setup-0.7.3-Windows-x64.exe").Path
          $installRoot = Join-Path $env:RUNNER_TEMP "FootageFlow-Clean-Install"
          if (Test-Path $installRoot) { Remove-Item $installRoot -Recurse -Force }
          $install = Start-Process $installer -ArgumentList @(
            "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=`"$installRoot`""
          ) -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Installer exited with code $($install.ExitCode)." }
          $app = Join-Path $installRoot "FootageFlow.exe"
          if (-not (Test-Path $app -PathType Leaf)) { throw "Clean installation did not create FootageFlow.exe." }
          $installedCore = Join-Path $installRoot "Core\FootageFlowCore.exe"
          $healthRequest = '{"id":"installed-health","action":"health","providerIDs":["wikimedia","internetArchive"],"language":"en"}'
          $health = $healthRequest | & $installedCore --core-request | ConvertFrom-Json
          if (-not $health.success -or $health.platform -ne "windows") {
            throw "The installed Windows core health check failed."
          }
          $process = Start-Process $app -PassThru
          Start-Sleep -Seconds 5
          if ($process.HasExited) {
            $startupLog = Join-Path $env:LOCALAPPDATA "FootageFlow\Logs\startup.log"
            if (Test-Path $startupLog) { Get-Content $startupLog }
            throw "The installed Windows GUI exited during startup with code $($process.ExitCode)."
          }
          Stop-Process -Id $process.Id -Force
          $uninstaller = Join-Path $installRoot "unins000.exe"
          $uninstall = Start-Process $uninstaller -ArgumentList @(
            "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART"
          ) -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "Uninstaller exited with code $($uninstall.ExitCode)." }
          if (Test-Path $app) { throw "Uninstall left the application executable behind." }

      - name: Upload Windows candidate artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FootageFlow-0.7.3-Windows-x64
          path: dist/windows/*
          if-no-files-found: error
          retention-days: 14

      - name: Scan tracked files for secrets
        shell: bash
        run: scripts/secret_scan.sh
